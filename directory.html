<!-- directory.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Funeral Home Directory</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="theme.css" />


  <script src="data-funeral-homes.js" defer></script>
  <script src="directory.js" defer></script>

  <!-- Theme system -->
  <script src="theme.js" defer></script>
</head>

<body>
  <header class="top-nav">
    <h1 id="greetingTitle">Directory</h1>

    <nav class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="firstCallForm.html">First Call Form</a>
      <a href="call-intake.html">Call Intake</a>
      <a href="serviceRequest.html">Service Request</a>
      <a href="on-call-dashboard.html">On-Call Dashboard</a>
      <a href="employee-portal.html">Employee Portal</a>
    </nav>
  </header>
  <div id="themeToggle">⚙️</div>

  <div id="themePanel" style="display:none;">
    <h3>Customize Theme</h3>
    <label>Theme Presets</label>
    <select id="themePresetPicker">
      <option value="">Select a theme…</option>
      <option value="midnight">Midnight Slate</option>
      <option value="softcloud">Soft Cloud</option>
      <option value="modernteal">Modern Teal</option>
      <option value="blush">Blush & Charcoal</option>
      <option value="ember">Ember Noir</option>
      <option value="frost">Frostbyte</option>
      <option value="sandstone">Sandstone</option>
      <option value="grape">Neon Grape</option>
    </select>
    <button id="resetTheme">Reset to Default</button>
  </div>
  
  <main class="directory-layout">

    <div class="directory-search">
      <input id="directorySearch" type="text" placeholder="Search funeral homes..." />
    </div>

    <div id="directoryList" class="directory-list"></div>

  </main>
  <script src="theme.js"></script>
  
</body>
</html>
